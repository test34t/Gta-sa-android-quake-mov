name: Build QuakeMove64

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Baixar AML (headers) e aml-psdk (structs do GTA SA)
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml_src
          git clone --depth 1 https://github.com/AndroidModLoader/aml-psdk psdk_src
          echo "AML:  $(git -C aml_src rev-parse --short HEAD)"
          echo "PSDK: $(git -C psdk_src rev-parse --short HEAD)"
          cp -r aml_src/mod ./mod
          cp -r psdk_src/aml-psdk ./aml-psdk

      - name: Gerar Android.mk e Application.mk
        run: |
          cat > Android.mk <<'MK'
          LOCAL_PATH := $(call my-dir)
          include $(CLEAR_VARS)
          LOCAL_CPP_EXTENSION := .cpp .cc
          LOCAL_MODULE := QuakeMove64
          LOCAL_SRC_FILES := main.cpp mod/logger.cpp mod/config.cpp
          LOCAL_CXXFLAGS += -O2 -DNDEBUG -std=c++17
          LOCAL_LDLIBS += -llog
          LOCAL_LDFLAGS += -Wl,-z,max-page-size=16384
          include $(BUILD_SHARED_LIBRARY)
          MK
          cat > Application.mk <<'MK'
          APP_STL := c++_static
          APP_ABI := arm64-v8a
          APP_PLATFORM := android-24
          MK
          cat Android.mk

      - name: Compilar com o NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK: $NDK"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk -j"$(nproc)"

      - name: Conferir a biblioteca gerada
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          SO=libs/arm64-v8a/libQuakeMove64.so
          ls -l "$SO"
          NM="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "$SO" | grep -E "OnModLoad|__GetModInfo|__INeedASpecificGame"
          test "$("$NM" -D --defined-only "$SO" | grep -c -E 'OnModLoad|__GetModInfo')" -ge 2

      - name: Guardar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: libQuakeMove64
          path: libs/arm64-v8a/libQuakeMove64.so

      - name: Publicar na aba Releases (download direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build mais recente
          body: Arquivo libQuakeMove64.so compilado automaticamente.
          files: libs/arm64-v8a/libQuakeMove64.so
          
